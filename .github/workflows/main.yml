name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.4.2
      - run: unzip -q teman-mod-1.18.2.zip
      - run: gradle build
        working-directory: teman-mod
      - uses: actions/upload-artifact@v4
        with:
          name: teman-jar
          path: teman-mod/build/libs/*.jar
